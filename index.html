<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำศัพท์ภาษาจีน 25 คำ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#241c15;--mute:#7a6d60;--red:#c0392b;--gold:#b7791f;--line:#e8dfd2;--soft:#f6ebe4;--ok:#2e7d32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1613;--card:#26211c;--ink:#f3ece3;--mute:#a89b8c;--red:#ef7b6c;--gold:#e0b25a;--line:#3a332b;--soft:#33261f;--ok:#7fd28a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.zh{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;font-weight:500}
.top{display:flex;gap:8px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.bar{flex:1;min-width:80px;height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .25s}
.cnt{font-size:13px;color:var(--mute);min-width:44px;text-align:right}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 12px;font-size:14px}
button:hover{border-color:var(--red)}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--red);color:#fff;border-color:var(--red)}
.stage{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex}
.slide{margin:auto;width:100%;max-width:820px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.num{color:var(--gold);font-size:14px;font-weight:700;letter-spacing:.04em}
.big{font-size:clamp(64px,16vw,120px);line-height:1.15;margin:6px 0 0;color:var(--red)}
.py{font-size:clamp(20px,5vw,28px);color:var(--mute);margin:2px 0 10px}
.pos{display:inline-block;background:var(--soft);color:var(--red);border-radius:99px;padding:3px 12px;font-size:14px;margin-bottom:10px}
.mean{font-size:clamp(22px,5.5vw,30px);font-weight:700;margin:4px 0 8px}
.use{color:var(--mute);font-size:16px;line-height:1.7;margin:0 0 16px}
.ex{background:var(--soft);border-left:4px solid var(--red);border-radius:10px;padding:12px 14px;margin-top:10px;cursor:pointer}
.ex .z{font-size:clamp(22px,5.5vw,28px);line-height:1.5}
.ex .p{color:var(--mute);font-size:15px}
.ex .t{margin-top:4px;font-size:16px}
body.hide-py .py,body.hide-py .ex .p{display:none}
body.hide-th .ex:not(.show) .t>span{display:none}
body.hide-th .ex:not(.show) .t::after{content:"แตะเพื่อดูคำแปล";color:var(--gold)}
.hero{text-align:center;padding:36px 10px}
.hero h1{font-size:clamp(30px,8vw,48px);margin:10px 0}
.hero p{color:var(--mute);font-size:17px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:16px}
.grid button{padding:10px 4px;text-align:center}
.grid .zh{display:block;font-size:24px;color:var(--red)}
.grid small{color:var(--mute);font-size:12px}
.grid button.sp{grid-column:span 2;border-color:var(--gold)}
.nav{display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;padding:12px;font-size:16px}
.nav .next{background:var(--red);color:#fff;border-color:var(--red)}
h2{margin:0 0 4px;font-size:24px}
h3{margin:22px 0 6px;font-size:18px;color:var(--gold)}
.spk{font-size:18px;padding:4px 10px;vertical-align:middle;margin-left:8px}
.sb{margin-top:14px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.sh{display:flex;gap:10px;align-items:baseline;color:var(--mute);font-size:14px}
.sc{font-size:28px;color:var(--red)}
.wrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:6px}
.wr{width:150px;height:150px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.wbtn{display:flex;flex-direction:column;gap:8px}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.strip div{text-align:center}.strip small{display:block;color:var(--mute);font-size:11px}
.strip svg{border-radius:6px;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--soft);border-radius:99px;padding:6px 14px;font-size:15px}
.chip.hl{background:var(--red);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.box{background:var(--soft);border-radius:12px;padding:12px 14px;line-height:1.7;font-size:16px}
.box b{color:var(--red)}
.src{color:var(--mute);font-size:12px;margin-top:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.mode{display:block;width:100%;text-align:left;padding:14px;margin-top:10px;font-size:16px}
.mode b{color:var(--red)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{padding:14px;font-size:18px;text-align:left}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{background:var(--red);color:#fff;border-color:var(--red)}
.qz{font-size:clamp(26px,7vw,40px);line-height:1.5;margin:10px 0}
.fb{margin-top:12px;font-size:16px;line-height:1.6}
.score{font-size:56px;color:var(--red);font-weight:700}
</style>
</head>

<button id="home">☰ สารบัญ</button>

    L=shuf(P).slice(0,10).map(p=>({say:p.z,q:"🔊",py:p.py,sub:"ฟังแล้วเลือกคำที่ได้ยิน",z:1,opts:shuf([p.z,...shuf(P.filter(x=>x.k!==p.k)).slice(0,3).map(x=>x.z)]),ans:p.z,exp:`${p.z} (${p.py}) ＝ ${p.th}`}))}
  Q={m,L,n:0,sc:0,sel:null,wrong:[]};
}
function exHTML(){
  if(!Q) return `<div class="card"><div class="num">แบบฝึกหัด</div><h2>ทบทวนคำศัพท์</h2><p class="use">เลือกรูปแบบที่ต้องการ ครั้งละ 10 ข้อ ข้อสอบสุ่มใหม่ทุกครั้ง</p>
  <button class="mode" data-act="mode" data-m="a"><b>ก. ตัวอักษรจีน → ความหมาย</b><br><small>ดูคำจีนแล้วเลือกความหมายภาษาไทย</small></button>
  <button class="mode" data-act="mode" data-m="b"><b>ข. เติมคำในประโยค</b><br><small>เลือกคำศัพท์ที่เหมาะกับช่องว่าง (มีข้อ 综合 ด้วย)</small></button>
  <button class="mode" data-act="mode" data-m="c"><b>ค. ฟังเสียง → เลือกคำ</b><br><small>ฟังเสียงอ่านแล้วเลือกตัวอักษร (ต้องเปิดเสียงเครื่อง)</small></button></div>`;
  if(Q.n>=Q.L.length) return `<div class="card" style="text-align:center"><div class="num">ผลคะแนน</div><div class="score">${Q.sc}/${Q.L.length}</div>
  <p class="use">${Q.sc>=9?"เยี่ยมมาก! 🎉":Q.sc>=6?"ดีแล้ว ทบทวนข้อที่พลาดอีกนิด":"ลองกลับไปดูสไลด์แล้วทำใหม่อีกครั้ง"}</p>
  ${Q.wrong.length?`<div style="text-align:left"><h3>ข้อที่ควรทบทวน</h3>${Q.wrong.map(e=>`<div class="box zh" style="margin-top:8px;font-weight:400">${e}</div>`).join("")}</div>`:""}
  <div class="tabs" style="justify-content:center;margin-top:16px"><button class="on" data-act="mode" data-m="${Q.m}">ทำโหมดนี้อีกครั้ง</button><button data-act="menu">เลือกโหมดอื่น</button></div></div>`;
  const q=Q.L[Q.n],a=Q.sel!==null;
  const qh=q.say?`<button class="spk" style="font-size:40px" data-act="say">🔊 ฟังอีกครั้ง</button>${window.speechSynthesis?"":`<div class="py">${q.py}</div>`}`:`<div class="qz zh">${q.q}</div>${q.py?`<div class="py">${q.py}</div>`:""}`;
  return `<div class="card"><div class="sh"><span>ข้อ ${Q.n+1}/${Q.L.length} · คะแนน ${Q.sc}</span></div><div class="num">${q.sub}</div>${qh}
  <div class="opts">${q.opts.map((o,k)=>`<button class="opt ${q.z?"zh":""} ${a?(o===q.ans?"ok":(k===Q.sel?"bad":"")):""}" data-act="opt" data-v="${k}" ${a?"disabled":""}>${o}</button>`).join("")}</div>
  ${a?`<div class="fb">${q.opts[Q.sel]===q.ans?"✅ ถูกต้อง":"❌ ยังไม่ถูก"} · <span class="zh">${q.exp}</span></div><div class="tabs"><button class="on" data-act="nq">${Q.n+1>=Q.L.length?"ดูผลคะแนน":"ข้อถัดไป →"}</button></div>`:""}</div>`;
}

function z1(){return `<div class="card"><div class="num">ทำความเข้าใจ · 综合</div><div class="big zh" style="font-size:clamp(56px,14vw,96px)">综合<button class="spk" data-act="say" data-t="综合">🔊</button></div><div class="py">zōnghé</div>
<div class="mean">เอาหลายอย่างมา “รวมเป็นภาพเดียว”</div>
<p class="use">เทียบเป็นภาษาไทย: <b>รวม / ผสมผสาน / สรุปรวม / รอบด้าน / บูรณาการ</b> (อังกฤษ: comprehensive, to synthesize)</p>
<h3>ที่มาของคำ (จำง่ายขึ้น)</h3>
<div class="two"><div class="box"><span class="zh" style="font-size:28px;color:var(--red)">综</span> = <span class="zh">纟</span> (เส้นไหม) + <span class="zh">宗</span><br>เดิมคืออุปกรณ์บน <b>กี่ทอผ้า</b> ที่ยกเส้นยืนขึ้น-ลงให้สอดกับเส้นพุ่ง ชุดเดียวคุมเส้นไหมได้เป็นพันเส้น จึงได้ความหมาย “รวบรวมเข้าด้วยกัน”</div>
<div class="box"><span class="zh" style="font-size:28px;color:var(--red)">合</span> = ปิดเข้าหากัน / รวมเป็นหนึ่ง<br>ตัวช่วยจำ: <span class="zh">人 + 一 + 口</span> ผู้คนหนึ่งเสียงเดียวกัน<br><b>综 + 合</b> = เส้นด้ายหลายเส้นถูกรวมเป็นผืนเดียว</div></div>
<h3>综合 ตรงข้ามกับ 分析</h3>
<div class="chips"><span class="chip">分析 fēnxī = แยกส่วนออกมาดู</span><span class="chip hl">综合 zōnghé = เอาส่วนต่าง ๆ มารวมเป็นภาพรวม</span></div>
<h3>ในชื่อวิชา: 综合课 คืออะไร?</h3>
<div class="box">วิชา <b class="zh">综合课</b> = วิชาภาษาจีนรวม สอน <b>หลายทักษะพร้อมกัน</b> (คำศัพท์ ไวยากรณ์ อ่าน ฟัง พูด) ส่วน <span class="zh">口语课</span> เน้นพูด, <span class="zh">听力课</span> เน้นฟัง, <span class="zh">阅读课</span> เน้นอ่าน — คือเน้น <b>ทักษะเดียว</b></div>
<div class="chips"><span class="chip hl zh">综合课</span><span class="chip">＝ 听 + 说 + 读 + 写 รวมกัน</span><span class="chip zh">口语课 / 听力课 / 阅读课</span></div>
<div class="src">อ้างอิง: 汉典 (zdic.net), 百度百科, CC-CEDICT/ChineseNotes</div></div>`}

function z2(){return `<div class="card"><div class="num">综合 · วิธีใช้</div><h2>ใช้ได้ 3 แบบหลัก (แตะประโยคเพื่อดูคำแปล)</h2>
<h3>1) เป็นกริยา: รวม / สรุปรวม</h3>
${exb("把这些意见综合起来。","Bǎ zhèxiē yìjiàn zōnghé qǐlái.","รวมความคิดเห็นเหล่านี้เข้าด้วยกัน")}
${exb("这本书综合了不同的观点。","Zhè běn shū zōnghé le bùtóng de guāndiǎn.","หนังสือเล่มนี้รวบรวมมุมมองที่แตกต่างกัน")}
<h3>2) เป็นคำขยาย: ครอบคลุม / รอบด้าน</h3>
${exb("我们有综合课和口语课。","Wǒmen yǒu zōnghé kè hé kǒuyǔ kè.","เรามีวิชาภาษาจีนรวมและวิชาสนทนา")}
${exb("这是一份综合性的调查报告。","Zhè shì yī fèn zōnghéxìng de diàochá bàogào.","นี่คือรายงานสำรวจฉบับครอบคลุม")}
<h3>3) 综合考虑 / 综合来看: “พิจารณา/มองโดยรวม”</h3>
${exb("这个问题需要综合考虑。","Zhège wèntí xūyào zōnghé kǎolǜ.","ปัญหานี้ต้องพิจารณาอย่างรอบด้าน")}
${exb("综合来看，这个方案是可行的。","Zōnghé lái kàn, zhège fāng’àn shì kěxíng de.","มองโดยรวมแล้ว แผนนี้ทำได้")}
<h3>คำที่มักเจอคู่กัน</h3>
<div class="chips"><span class="chip"><b class="zh">综合课</b> วิชาภาษาจีนรวม</span><span class="chip"><b class="zh">综合实力</b> ศักยภาพโดยรวม</span><span class="chip"><b class="zh">综合报告</b> รายงานฉบับรวม</span><span class="chip"><b class="zh">综合性医院</b> โรงพยาบาลทั่วไป</span><span class="chip"><b class="zh">综合症</b> กลุ่มอาการ (syndrome)</span></div>
<h3>ข้อควรระวัง</h3>
<div class="box">• <b>ไม่ใช่การบวกเลขธรรมดา</b> ต้องเป็นการเอาหลายส่วนมาประกอบเป็นภาพรวม (ถ้าแค่บวกรวม ใช้ <span class="zh">加起来</span>)<br>• ค่อนไปทางทางการ/ภาษาเขียน ในชีวิตประจำวันเจอบ่อยในชื่อวิชา ผลประเมิน และรายงาน<br>• <span class="zh">全面</span> = ครบทุกด้าน, <span class="zh">总结</span> = สรุปสิ่งที่ทำมา — ไม่เหมือน 综合</div>
<div class="src">อ้างอิง: 汉典, ChinesePod, HackChinese, ChineseNotes</div></div>`}

function render(){
  const s=SL[i];let h="";
  if(s.t==="intro"){
    h=`<div class="card hero"><div class="num">คำศัพท์ภาษาจีน</div><h1 class="zh">汉语词汇 · ${N} คำ</h1>
    <p>ใช้ปุ่มลูกศร ปัดซ้าย-ขวา หรือกดปุ่มด้านล่างเพื่อเปลี่ยนสไลด์<br>มีลำดับขีด 🖌, อธิบาย 综合 เพิ่มเติม และแบบฝึกหัดท้ายบท</p>
    <div class="grid">${W.map((w,k)=>`<button data-go="${idxW(k)}"><span class="zh">${w[0].replace(" + V","")}</span><small>${k+1}</small></button>`).join("")}
    <button class="sp" data-go="${idxT("z1")}"><span class="zh">综合</span><small>อธิบายเพิ่ม</small></button><button class="sp" data-go="${idxT("ex")}"><span class="zh">练习</span><small>แบบฝึกหัด</small></button></div></div>`;
  }else if(s.t==="w"){
    const w=W[s.k];
    h=`<div class="card"><div class="num">${s.k+1} / ${N}</div><div class="big zh">${w[0]}<button class="spk" data-act="say" data-t="${w[0].replace(" + V","")}">🔊</button></div><div class="py">${w[1]}</div>
    <span class="pos">${w[2]}</span><div class="mean">${w[3]}</div>${w[4]?`<p class="use">${w[4]}</p>`:""}
    ${w[5].map(e=>exb(e[0],e[1],e[2])).join("")}${s.k===ZI?`<div class="tabs"><button class="on" data-go="${idxT("z1")}">ทำความเข้าใจ 综合 เพิ่มเติม →</button></div>`:""}${strokes(w)}</div>`;
  }else if(s.t==="z1")h=z1();else if(s.t==="z2")h=z2();else h=exHTML();
  S.innerHTML=h;initW();
  $("pb").style.width=(i/T*100)+"%";$("cnt").textContent=i+"/"+T;
  $("prev").disabled=i===0;$("next").disabled=i===T;
  S.parentElement.scrollTop=0;
  try{history.replaceState(null,"","#s"+i)}catch(e){}
  if(s.t==="ex"&&Q&&Q.n<Q.L.length&&Q.L[Q.n].say&&Q.sel===null)say(Q.L[Q.n].say);
}
function go(n){i=Math.max(0,Math.min(T,n));render()}
$("prev").onclick=()=>go(i-1);$("next").onclick=()=>go(i+1);$("home").onclick=()=>go(0);
$("tpy").onclick=e=>{document.body.classList.toggle("hide-py");e.target.classList.toggle("on")};
$("tth").onclick=e=>{document.body.classList.toggle("hide-th");e.target.classList.toggle("on");render()};
S.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g)return go(+g.dataset.go);
  const b=e.target.closest("[data-act]");
  if(b){
    const a=b.dataset.act,c=b.dataset.c,wr=c&&S.querySelector(`.wr[data-c="${c}"]`);
    if(a==="anim"&&wr&&wr._w){wr._w.cancelQuiz();wr._w.animateCharacter()}
    else if(a==="quiz"&&wr&&wr._w)wr._w.quiz();
    else if(a==="rst"&&wr&&wr._w){wr._w.cancelQuiz();wr._w.showCharacter()}
    else if(a==="say")say(b.dataset.t||Q.L[Q.n].say);
    else if(a==="mode"){mk(b.dataset.m);render()}
    else if(a==="menu"){Q=null;render()}
    else if(a==="opt"){const q=Q.L[Q.n];Q.sel=+b.dataset.v;if(q.opts[Q.sel]===q.ans)Q.sc++;else Q.wrong.push(q.exp);render()}
    else if(a==="nq"){Q.n++;Q.sel=null;render()}
    return;
  }
  const x=e.target.closest(".ex");if(x)x.classList.toggle("show");
});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(i+1);else if(e.key==="ArrowLeft")go(i-1)});
let sx=null;
S.addEventListener("touchstart",e=>{sx=e.target.closest(".wr")?null:e.touches[0].clientX},{passive:true});
S.addEventListener("touchend",e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>70)go(i+(d<0?1:-1));sx=null});
const m=/^#s(\d+)$/.exec(location.hash);i=m?Math.min(T,+m[1]):0;render();
</script>
